name: Build Bun Server

# Produces per-platform Bun standalone server bundles (binary + webapp/ + bin
# sidecars, zip). Runs on release tags, on manual dispatch, and on PRs that
# touch the build inputs (build-only — the release job is tag-gated). Each target
# builds on an OS runner; exec bits for committed sidecars are set by the bundler
# (scripts/build-bun.mjs), not relied on from the runner's checkout mode.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'webapp/**'
      - 'bin/**'
      - 'cli-boot-wrapper.js'
      - 'scripts/build-bun.mjs'
      - 'package.json'
      - '.github/workflows/build-bun.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    # The smoke steps drive a real server: a wedged accept-but-never-respond
    # process would otherwise sit in a retry loop until the 6-hour default,
    # burning paid macOS/Windows runners and showing "still running" instead of
    # a failure. Every smoke curl also carries --max-time. A full build+smoke
    # is ~2 minutes today.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, key: win-x64,     smoke: true }
          - { os: ubuntu-latest,  key: linux-x64,    smoke: true }
          - { os: ubuntu-latest,  key: linux-arm64,  smoke: false }  # cross-compiled from x64
          - { os: ubuntu-latest,  key: linux-x64-musl,   smoke: false }  # musl (Alpine); a musl binary can't run on the glibc runner
          - { os: ubuntu-latest,  key: linux-arm64-musl, smoke: false }  # musl + cross-arch
          - { os: macos-latest,   key: darwin-arm64, smoke: true }   # native (Apple silicon runner)
          - { os: macos-latest,   key: darwin-x64,   smoke: false }  # cross-compiled from arm64
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install production dependencies
        run: npm ci --omit=dev

      # Bun can't download+extract its own baseline cross-runtime on the Windows
      # runner ("Failed to extract executable ... download may be incomplete"), so
      # fetch it ourselves and hand it to the build via --compile-executable-path
      # (build-bun.mjs reads BUN_COMPILE_EXEC_PATH). This lets win-x64 ship as a
      # baseline build (runs on pre-AVX2 CPUs) while still building Windows-on-
      # Windows so the .exe keeps its embedded icon.
      - name: Pre-fetch baseline runtime (win-x64)
        if: matrix.key == 'win-x64'
        shell: pwsh   # the runner's git-bash uses GNU tar, which can't extract a .zip
        run: |
          $V = (bun --version).Trim()
          Write-Host "bun $V - pre-fetching bun-windows-x64-baseline runtime"
          Invoke-WebRequest "https://github.com/oven-sh/bun/releases/download/bun-v$V/bun-windows-x64-baseline.zip" -OutFile baseline.zip
          Expand-Archive baseline.zip -DestinationPath baseline-rt -Force
          $exe = (Get-ChildItem -Recurse baseline-rt -Filter bun.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'bun.exe not found in the baseline runtime archive' }
          "BUN_COMPILE_EXEC_PATH=$exe" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "runtime: $exe"

      # Desktop tray launcher: the bundler stages bin/rust-launcher/<name> as
      # the bundle's double-click face (mStream.exe / .app executable /
      # mstream-desktop). Those binaries are CI-committed on master pushes
      # (build-rust-launcher.yml); on PRs — and before the first commit lands —
      # build this leg's launcher here so the bundle and its smokes cover the
      # real product shape. Launcher-less targets (linux-arm64, musl) skip:
      # their bundles ship server-only by design.
      - name: Build launcher (if not committed)
        if: matrix.key == 'win-x64' || matrix.key == 'linux-x64' || matrix.key == 'darwin-arm64' || matrix.key == 'darwin-x64'
        shell: bash
        run: |
          set -e
          case "${{ matrix.key }}" in
            win-x64)      NAME=mstream-launcher-win32-x64.exe; TARGET=x86_64-pc-windows-msvc ;;
            linux-x64)    NAME=mstream-launcher-linux-x64;     TARGET=x86_64-unknown-linux-gnu ;;
            darwin-arm64) NAME=mstream-launcher-darwin-arm64;  TARGET=aarch64-apple-darwin ;;
            darwin-x64)   NAME=mstream-launcher-darwin-x64;    TARGET=x86_64-apple-darwin ;;
          esac
          if [ -f "bin/rust-launcher/$NAME" ]; then echo "committed launcher present: $NAME"; exit 0; fi
          echo "no committed launcher — building $NAME ($TARGET)"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          fi
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET" --manifest-path rust-launcher/Cargo.toml
          SRC="rust-launcher/target/$TARGET/release/mstream-launcher"
          if [ "${{ runner.os }}" = "Windows" ]; then SRC="$SRC.exe"; fi
          mkdir -p bin/rust-launcher
          cp "$SRC" "bin/rust-launcher/$NAME"
          echo "built: bin/rust-launcher/$NAME"

      - name: Build + bundle (${{ matrix.key }})
        run: bun scripts/build-bun.mjs --target=${{ matrix.key }} --bundle

      - name: Smoke test (self-dispatch + boot + serve + scan)
        if: matrix.smoke
        shell: bash
        run: |
          set +e   # exit codes are checked explicitly; don't abort on a probe miss
          D=$(ls -d dist/stage/mStream-*-${{ matrix.key }})
          # The SERVER is mstream-server in every bundle (1c rename); the
          # user-facing mStream.exe / .app executable is the tray launcher,
          # which has its own smoke step below.
          if [ -d "$D/mStream.app" ]; then BIN="$D/mStream.app/Contents/MacOS/mstream-server"; elif [ -f "$D/mstream-server.exe" ]; then BIN="$D/mstream-server.exe"; else BIN="$D/mstream-server"; fi
          RUN=$(dirname "$BIN")
          echo "smoke binary: $BIN"

          # (1) self-dispatch: the binary must re-invoke itself as a worker
          OUT=$("$BIN" --mstream-worker=scanner '{}' 2>&1)
          echo "$OUT" | grep -q dbPath || { echo "FAIL: worker self-dispatch"; echo "$OUT"; exit 1; }
          echo "ok: worker self-dispatch"

          # (2) default-path boot (no -j) — the double-click invocation. A fresh
          # standalone install is the DESKTOP profile: the config resolves to the
          # per-OS user data home and is generated with Quick Connect on
          # (src/util/boot-config.js). Port-independent: only assert the config
          # landed where it should without a setup error (the next step proves
          # the binary actually serves).
          case "${{ matrix.key }}" in
            win-*)    DATAHOME="$LOCALAPPDATA/mStream" ;;
            darwin-*) DATAHOME="$HOME/Library/Application Support/mStream" ;;
            *)        DATAHOME="${XDG_DATA_HOME:-$HOME/.local/share}/mstream" ;;
          esac
          rm -rf "$DATAHOME"
          "$BIN" > "$RUN/default-boot.log" 2>&1 &
          DEF=$!
          sleep 7
          kill "$DEF" 2>/dev/null
          if grep -qiE "Failed to validate config|ENOENT" "$RUN/default-boot.log"; then echo "FAIL: default (no -j) boot — config setup error"; cat "$RUN/default-boot.log"; exit 1; fi
          CFG="$DATAHOME/conf/default.json"
          test -f "$CFG" || { echo "FAIL: default config not created at $CFG"; tail -25 "$RUN/default-boot.log"; exit 1; }
          grep -q '"shareCodePublic": true' "$CFG" || { echo "FAIL: desktop-profile config lacks the Quick Connect defaults"; cat "$CFG"; exit 1; }
          test -f "$RUN/save/conf/default.json" && { echo "FAIL: desktop profile also wrote a next-to-binary config"; exit 1; }
          rm -rf "$DATAHOME"
          echo "ok: default boot used the user data home (Quick Connect on)"

          # (2b) --portable keeps the old next-to-binary layout and still guards
          # the fresh-bundle save/conf ENOENT regression; the Quick Connect
          # opt-out flag must be accepted alongside it (it's a no-op here — only
          # the desktop profile generates a Quick Connect config).
          "$BIN" --portable --quick-connect-off-by-default > "$RUN/portable-boot.log" 2>&1 &
          DEF=$!
          sleep 7
          kill "$DEF" 2>/dev/null
          if grep -qiE "Failed to validate config|ENOENT|unknown option" "$RUN/portable-boot.log"; then echo "FAIL: --portable boot — config setup or option error"; cat "$RUN/portable-boot.log"; exit 1; fi
          test -f "$RUN/save/conf/default.json" || { echo "FAIL: --portable did not create save/conf/default.json"; tail -25 "$RUN/portable-boot.log"; exit 1; }
          rm -rf "$RUN/save"
          echo "ok: --portable boot stayed next to the binary (no ENOENT)"

          # (3) boot + serve + scan. The repo's test fixtures are generated by the
          # test suite (not present in this build job), so make a tiny library here:
          # a 1s tagged mp3 via the runner's ffmpeg, or an empty dir if it's absent.
          WS=$(printf '%s' "$GITHUB_WORKSPACE" | tr '\134' '/')   # backslash -> slash for valid JSON on Windows
          MUSIC="$WS/smoke-music"
          mkdir -p "$MUSIC"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=1" -metadata title=Smoke -metadata artist=CI "$MUSIC/smoke.mp3" -y || echo "ffmpeg unavailable; scanning an empty library"
          printf '{"port":3399,"folders":{"music":{"root":"%s"}}}\n' "$MUSIC" > "$RUN/smoke-config.json"
          "$BIN" -j "$RUN/smoke-config.json" > "$RUN/boot.log" 2>&1 &
          SRV=$!
          UP=0
          for i in $(seq 1 60); do
            sleep 1
            if curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:3399/api/v1/ping"; then UP=1; break; fi
          done
          sleep 3   # let the boot scan finish
          CODE=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3399/api/v1/ping" 2>/dev/null)
          echo "HTTP up=$UP after ~${i}s ; /api/v1/ping -> ${CODE:-000}"
          grep -iE "scan started|scan complete" "$RUN/boot.log"

          # (4) soft reboot must survive under the BUN runtime. Node's test
          # suite can't catch this class: reboot()'s delayed sweep once hit
          # the NEW server, and Bun's closeAllConnections (unlike Node's)
          # stops the listener outright — the binary kept running with no
          # port. Trigger a reboot-requiring config change, require the
          # server back up, then require it STILL up after the ~1s sweep.
          # Fail closed: assert the TRIGGER worked (a 400 from a renamed key or
          # an auth wall would otherwise leave the server up and pass this step
          # having rebooted nothing), and require a SECOND "Access mStream
          # locally" line as positive proof a re-serve actually happened.
          REBOOT_OK=0
          if [ "$CODE" = "200" ]; then
            BOOTS_BEFORE=$(grep -c "Access mStream locally" "$RUN/boot.log")
            TRIG=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"trustProxy":true}' "http://127.0.0.1:3399/api/v1/admin/config/trust-proxy")
            if [ "$TRIG" != "200" ]; then
              echo "FAIL: reboot trigger POST returned ${TRIG:-000}, not 200 — the smoke would have passed without rebooting anything"
              cat "$RUN/boot.log"; kill "$SRV" 2>/dev/null; exit 1
            fi
            for i in $(seq 1 20); do
              sleep 1
              if curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:3399/api/v1/ping"; then REBOOT_OK=1; break; fi
            done
            sleep 3   # outlive the close-grace sweep, which used to kill the new listener
            curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:3399/api/v1/ping" || REBOOT_OK=0
            BOOTS_AFTER=$(grep -c "Access mStream locally" "$RUN/boot.log")
            if [ "$BOOTS_AFTER" -le "$BOOTS_BEFORE" ]; then
              echo "FAIL: no re-serve observed (boot lines ${BOOTS_BEFORE} -> ${BOOTS_AFTER}) — the reboot never happened"
              REBOOT_OK=0
            fi

            # (5) overlapping reboots must not kill the process. Two rapid admin
            # saves used to start two serveIt()s racing for the port; the loser
            # exhausted the relisten budget and process.exit()ed the healthy
            # winner. /config/address is the right trigger: unlike trust-proxy
            # and most others it has NO unchanged-value short-circuit, so both
            # POSTs really do reboot (with a no-op second POST this test passes
            # against the bug). Bind stays reachable at 127.0.0.1.
            # Capture each POST's status. Previously these were `curl -s` with
            # no -f and their exit codes discarded by `wait`, so if the endpoint
            # ever 400s or moves (a renamed Joi key, a moved route) NO reboot
            # fired, the untouched server answered every probe, and the step
            # printed "survived two overlapping reboots" — the rebootInFlight
            # coalescing could have been deleted outright and this stayed green.
            CONCURRENT_BOOTS_BEFORE=$(grep -c "Access mStream locally" "$RUN/boot.log")
            curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X POST -H 'Content-Type: application/json' -d '{"address":"127.0.0.1"}' "http://127.0.0.1:3399/api/v1/admin/config/address" > "$RUN/post1.code" &
            C1=$!
            curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X POST -H 'Content-Type: application/json' -d '{"address":"127.0.0.1"}' "http://127.0.0.1:3399/api/v1/admin/config/address" > "$RUN/post2.code" &
            C2=$!
            wait $C1 $C2
            CONCURRENT_OK=0
            for i in $(seq 1 25); do
              sleep 1
              if curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:3399/api/v1/ping"; then CONCURRENT_OK=1; break; fi
            done
            # Must outlive a losing sibling's FULL relisten budget (20 x 250ms):
            # the process.exit lands ~5s in, and a shorter wait passes against
            # the very bug this guards.
            sleep 10
            curl -sf --max-time 5 -o /dev/null "http://127.0.0.1:3399/api/v1/ping" || CONCURRENT_OK=0
            kill -0 "$SRV" 2>/dev/null || CONCURRENT_OK=0
            # Fail closed on the TRIGGERS, not just on survival: both requests
            # must have been accepted, and the server must actually have come
            # back up again afterwards. Without these, "nothing happened" is
            # indistinguishable from "handled two overlapping reboots".
            POST1=$(cat "$RUN/post1.code" 2>/dev/null)
            POST2=$(cat "$RUN/post2.code" 2>/dev/null)
            CONCURRENT_BOOTS_AFTER=$(grep -c "Access mStream locally" "$RUN/boot.log")
            if [ "$POST1" != "200" ] || [ "$POST2" != "200" ]; then
              echo "FAIL: reboot triggers were not accepted (HTTP $POST1 / $POST2) — this step would otherwise pass having rebooted NOTHING"
              CONCURRENT_OK=0
            fi
            if [ "$CONCURRENT_BOOTS_AFTER" -le "$CONCURRENT_BOOTS_BEFORE" ]; then
              echo "FAIL: no additional boot after the overlapping reboots (before=$CONCURRENT_BOOTS_BEFORE after=$CONCURRENT_BOOTS_AFTER) — the server never actually restarted"
              CONCURRENT_OK=0
            fi
            # Positive evidence that the SECOND request hit the coalescing guard
            # rather than being silently lost. Advisory: the interleaving is
            # timing-dependent, so a miss is reported, not fatal.
            grep -q "Reboot already in progress" "$RUN/boot.log" \
              && echo "ok: the duplicate reboot request was coalesced" \
              || echo "note: no coalescing line — the two reboots did not overlap on this runner"
          fi
          kill "$SRV" 2>/dev/null

          if [ "$CODE" != "200" ]; then echo "FAIL: server did not serve 200"; echo "--- boot.log ---"; cat "$RUN/boot.log"; exit 1; fi
          grep -q "Scan complete" "$RUN/boot.log" || { echo "FAIL: scan did not complete"; echo "--- boot.log ---"; cat "$RUN/boot.log"; exit 1; }
          if [ "$REBOOT_OK" != "1" ]; then echo "FAIL: server did not survive a soft reboot (admin config change)"; echo "--- boot.log ---"; cat "$RUN/boot.log"; exit 1; fi
          if [ "$CONCURRENT_OK" != "1" ]; then echo "FAIL: server did not survive two overlapping reboots"; echo "--- boot.log ---"; cat "$RUN/boot.log"; exit 1; fi
          echo "SMOKE OK: $BIN booted, served 200, completed a scan, and survived both a soft reboot and overlapping reboots"

      - name: Smoke test desktop launcher (spawn + supervise + no-orphan)
        # The launcher IS the bundle's double-click face now. Prove the
        # integrated shape on each native leg: launcher finds its
        # mstream-server sibling, spawns it --supervised, the server serves,
        # and a hard-killed launcher takes the server down through the
        # supervision pipe (the no-orphan property the whole design rests on).
        # Tray construction is environment-dependent on runners (no
        # StatusNotifier host on linux, CI sessions vary) — the launcher
        # degrades gracefully and logs it, so this smoke asserts lifecycle,
        # not pixels. Linux runs under xvfb so gtk init succeeds at all.
        if: matrix.smoke
        shell: bash
        run: |
          set +e
          D=$(ls -d dist/stage/mStream-*-${{ matrix.key }})
          case "${{ matrix.key }}" in
            win-*)    LAUNCHER="$D/mStream.exe" ;;
            darwin-*) LAUNCHER="$D/mStream.app/Contents/MacOS/mStream" ;;
            *)        LAUNCHER="$D/mstream-desktop" ;;
          esac
          [ -f "$LAUNCHER" ] || { echo "FAIL: launcher not staged at $LAUNCHER"; ls -la "$D"; exit 1; }

          # Isolated per-user dirs so this can't touch the earlier boots' state.
          LH="$RUNNER_TEMP/launcher-home"
          rm -rf "$LH"; mkdir -p "$LH"
          export MSTREAM_LAUNCHER_SKIP_AUTOSTART=1
          case "${{ matrix.key }}" in
            win-*)    export LOCALAPPDATA="$LH"; DH="$LH/mStream" ;;
            darwin-*) export HOME="$LH"; DH="$LH/Library/Application Support/mStream" ;;
            *)        export HOME="$LH"; DH="$LH/.local/share/mstream" ;;
          esac

          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get install -y -qq xvfb > /dev/null 2>&1
            xvfb-run -a "$LAUNCHER" --tray --no-open > "$LH/launcher-run.log" 2>&1 &
          else
            "$LAUNCHER" --tray --no-open > "$LH/launcher-run.log" 2>&1 &
          fi
          WRAP=$!

          UP=0
          for i in $(seq 1 45); do
            sleep 1
            if curl -sf --max-time 3 -o /dev/null "http://127.0.0.1:3000/api/v1/ping"; then UP=1; break; fi
          done
          if [ "$UP" != "1" ]; then
            echo "FAIL: launcher-managed server never served on 3000"
            cat "$LH/launcher-run.log" 2>/dev/null; cat "$DH/logs/launcher.log" 2>/dev/null; cat "$DH/logs/server-console.log" 2>/dev/null | tail -20
            exit 1
          fi
          echo "ok: launcher spawned mstream-server; serving on 3000 (~${i}s)"

          # The health event must land in the launcher's own log (settle loop —
          # the prober ticks at 500ms behind the port opening).
          HUP=0
          for i in $(seq 1 20); do
            grep -q "server is up" "$DH/logs/launcher.log" 2>/dev/null && { HUP=1; break; }
            sleep 0.5
          done
          [ "$HUP" = "1" ] || { echo "FAIL: no 'server is up' in launcher.log"; cat "$DH/logs/launcher.log"; exit 1; }
          grep -i "tray unavailable" "$DH/logs/launcher.log"             && echo "note: tray degraded gracefully on this runner"             || echo "note: tray constructed"

          # Hard-kill the launcher — never the server — and require the server
          # to follow it down via supervision-stdin EOF.
          # pgrep -x (exact process name), never -f: a cmdline pattern matches
          # the xvfb-run wrapper — whose kill -9 does NOT propagate — and can
          # even match the polling shell itself (that footgun killed the local
          # Docker smoke's own script mid-run).
          case "${{ matrix.key }}" in
            win-*)    LPID=$WRAP ;;
            darwin-*) LPID=$(pgrep -x mStream | head -1); LPID=${LPID:-$WRAP} ;;
            *)        LPID=$(pgrep -x mstream-desktop | head -1); LPID=${LPID:-$WRAP} ;;
          esac
          kill -9 "$LPID" 2>/dev/null
          DOWN=0
          for i in $(seq 1 12); do
            sleep 1
            curl -sf --max-time 2 -o /dev/null "http://127.0.0.1:3000/api/v1/ping" || { DOWN=1; break; }
          done
          if [ "$DOWN" != "1" ]; then
            echo "FAIL: server still serving after the launcher was hard-killed — ORPHAN"
            pkill -f mstream-server 2>/dev/null
            exit 1
          fi
          echo "SMOKE OK: launcher spawn, health, and no-orphan supervision all behave"

      - name: Smoke test iroh native binding
        # Proves the standalone binary can dlopen the bundled @number0/iroh .node
        # (bin/iroh/, staged by build-bun.mjs) via NAPI_RS_NATIVE_LIBRARY_PATH —
        # remote access silently degrades if it can't, so assert it loudly. Only
        # the native (non-cross) targets can run here, same as the boot smoke.
        if: matrix.smoke
        shell: bash
        run: |
          set -e
          D=$(ls -d dist/stage/mStream-*-${{ matrix.key }})
          if [ -d "$D/mStream.app" ]; then BIN="$D/mStream.app/Contents/MacOS/mstream-server"; elif [ -f "$D/mstream-server.exe" ]; then BIN="$D/mstream-server.exe"; else BIN="$D/mstream-server"; fi
          echo "iroh smoke binary: $BIN"
          OUT=$("$BIN" --mstream-worker=iroh-selftest '{}' 2>&1) || { echo "$OUT"; echo "FAIL: iroh self-test exited non-zero"; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -q IROH_OK || { echo "FAIL: iroh native binding did not load in the standalone binary"; exit 1; }
          echo "OK: iroh native binding loaded from the bundled .node"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mStream-${{ matrix.key }}
          path: dist/mStream-*-${{ matrix.key }}.zip
          if-no-files-found: error

  release:
    name: Attach bundles to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Attach bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # This is the sole release pipeline: create the release as a DRAFT so it
        # can be reviewed and PUBLISHED manually (publishing is what fires the
        # downstream npm-publish / deploy-demo jobs), idempotent on same-tag
        # re-runs, then upload the bundles. A genuine create failure fails the job.
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" bundles/*.zip --clobber --repo "$REPO"
