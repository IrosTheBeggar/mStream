# Builds the p2p-sidecar binaries (the iroh networking companion for the
# music-discovery network), publishes them as GitHub RELEASE assets under
# immutable names, and commits only a small text MANIFEST
# (bin/p2p-sidecar/manifest.json: per-platform file name + sha256 + size +
# url + source-tree hash) that the server's fetch-on-first-use verifies
# against (src/util/p2p-sidecar-bootstrap.js).
#
# This family used to follow build-rust-parser.yml's commit-the-binaries
# model; it was the worst offender by far — nine ~20 MB iroh-linked binaries
# per refresh, ~1.1 GB of undeltifiable blobs already in master's history —
# so it moved to release assets first. PRs stay source-only either way.
#
# Assets live on the rolling `p2p-sidecar-assets` release (prerelease, so it
# never becomes `releases/latest` for install.sh), and are APPEND-ONLY:
# names embed the source-tree hash and the binary's own sha256, so an
# existing name is byte-identical by construction — the publish step skips
# it, never replaces it, and every manifest ever committed keeps resolving.
# Workflow ARTIFACTS would expire (90 days max) and break old manifests.
#
# musl (Alpine) legs live in build-p2p-sidecar-musl.yml — the linuxserver.io
# Docker image is Alpine, so those are load-bearing, not a nicety. That
# workflow uploads to the SAME release but owns manifest-musl.json, so the
# two publishers never write the same path (the old .source-tree /
# .source-tree-musl stamp split, carried forward).
name: Build P2P Sidecar Binaries

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + self-test only; do not publish assets or commit the manifest'
        type: boolean
        default: false
  push:
    branches: [master]
    # The workflow file itself is a build input (toolchain pins, build
    # flags) — every sibling family lists its own; this one was missing it.
    # The manifest helper script is a publish input for the same reason.
    paths:
      - 'p2p-sidecar/**'
      - '.github/workflows/build-p2p-sidecar.yml'
      - 'scripts/p2p-sidecar-manifest.mjs'

# Serialize runs of THIS workflow per ref (see build-rust-parser.yml — same
# rationale; sibling families keep their own groups on purpose).
concurrency:
  group: build-p2p-sidecar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # self_test: run the freshly built binary before committing it —
        # enabled wherever the binary can execute on its build host (see
        # build-rust-parser.yml for the darwin-arm64 cautionary tale). The
        # cross-built ARM Linux binaries can't run on the x64 host.
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_name: p2p-sidecar-win32-x64.exe
            use_cross: false
            self_test: true

          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: p2p-sidecar-darwin-x64
            use_cross: false
            self_test: true

          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: p2p-sidecar-darwin-arm64
            use_cross: false
            self_test: true

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: p2p-sidecar-linux-x64
            use_cross: false
            self_test: true

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: p2p-sidecar-linux-arm64
            use_cross: true

          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            binary_name: p2p-sidecar-linux-arm
            use_cross: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: p2p-sidecar
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          # Pinned + hashed: `releases/latest` piped straight into ~/.cargo/bin
          # meant a new (or hijacked) cross release ran on the next master push
          # and produced the shipped ARM/musl binaries. Bump the version and
          # the sha256 together (sha256sum of the release asset).
          curl -fsSL -o cross.tar.gz "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz"
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  cross.tar.gz" | sha256sum -c -
          tar xzf cross.tar.gz -C "$HOME/.cargo/bin" && rm cross.tar.gz

      # The wire-verification unit tests (forged signatures, impersonation,
      # tampered holds) run on the native leg — one platform suffices for
      # pure logic, and the cross legs can't execute their test binaries.
      - name: Unit tests
        if: matrix.self_test
        run: cargo test --manifest-path p2p-sidecar/Cargo.toml
        shell: bash

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} --manifest-path p2p-sidecar/Cargo.toml
          else
            cargo build --release --locked --target ${{ matrix.target }} --manifest-path p2p-sidecar/Cargo.toml
          fi
        shell: bash

      - name: Rename binary
        run: |
          src="p2p-sidecar/target/${{ matrix.target }}/release/p2p-sidecar"
          if [[ "${{ matrix.binary_name }}" == *.exe ]]; then
            src="${src}.exe"
          fi
          mkdir -p staging
          cp "$src" "staging/${{ matrix.binary_name }}"
        shell: bash

      # --print-id is the sidecar's one-shot CI mode: create an identity,
      # print the derived endpoint id (64 hex chars), exit — no sockets, no
      # network. Proves the executable launches and its crypto stack works.
      - name: Self-test the freshly built binary
        if: matrix.self_test
        shell: bash
        run: |
          bin="staging/${{ matrix.binary_name }}"
          echo "self-testing: $bin"
          out="$("$bin" --print-id --data-dir selftest-data)"
          echo "  --print-id: $out"
          echo "$out" | grep -Eq '^[0-9a-f]{64}$' \
            || { echo "::error::self-test: --print-id produced no/invalid output"; exit 1; }
          # Second run must load the SAME identity from disk, not mint a new one.
          out2="$("$bin" --print-id --data-dir selftest-data)"
          [ "$out" = "$out2" ] \
            || { echo "::error::self-test: identity did not persist between runs"; exit 1; }
          echo "self-test passed: ${{ matrix.binary_name }}"

      # Real-run smoke (Linux only — needs GNU timeout): --print-id never
      # opens a socket, so it misses runtime breakage in the QUIC/UDP layer —
      # noq-udp 1.1.0's musl cmsg-alignment assert (2026-07) passed the
      # identity checks and SIGABRTed at endpoint bind in production. With
      # stdin at EOF the sidecar emits 'ready' (right after the endpoint
      # binds — no relay round-trip) and exits cleanly on its own.
      - name: Real-run smoke
        if: matrix.self_test && runner.os == 'Linux'
        shell: bash
        run: |
          bin="staging/${{ matrix.binary_name }}"
          set +e
          real_out="$(timeout 30 "$bin" --data-dir smoke-data </dev/null 2>&1)"
          real_code=$?
          set -e
          echo "  real-run exit=$real_code"
          echo "$real_out" | head -3
          echo "$real_out" | grep -q '"event":"ready"' \
            || { echo "::error::real-run smoke: no ready event before exit"; exit 1; }
          [ "$real_code" -eq 0 ] \
            || { echo "::error::real-run smoke: sidecar exited $real_code (expected clean EOF shutdown)"; exit 1; }
          echo "real-run smoke passed: ${{ matrix.binary_name }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: staging/${{ matrix.binary_name }}
          # 7, not 1: the commit job refuses a partial set (see there).
          retention-days: 7

  publish:
    name: Publish assets + manifest
    needs: build
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Into a scratch dir, NOT bin/ — see build-rust-parser.yml's commit
      # job: the inventory must see exactly what this run built, and the
      # no-rebase loop re-checkouts the tip, which needs a clean worktree.
      # (This family's scar: an unstaged mode change once made the old
      # `git pull --rebase` refuse to run, and zero p2p-sidecar binaries
      # shipped while every build leg was green.)
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true

      # Order is load-bearing: assets are uploaded BEFORE the manifest that
      # references them is committed, so a manifest on master never points
      # at a missing asset. A failure between the two leaves orphaned,
      # unreferenced assets — harmless, immutable, cheap.
      - name: Upload release assets and commit the manifest
        env:
          TRIGGER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          release_tag="p2p-sidecar-assets"
          manifest_file="manifest.json"
          names="p2p-sidecar-win32-x64.exe p2p-sidecar-darwin-x64 p2p-sidecar-darwin-arm64 p2p-sidecar-linux-x64 p2p-sidecar-linux-arm64 p2p-sidecar-linux-arm"

          # 1. Inventory: every leg, non-empty (see build-rust-parser.yml).
          missing=""
          for name in $names; do
            [ -s "staging/$name" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::not all p2p-sidecar binaries were built by this run (missing:$missing) — an artifact expired or a leg was skipped; re-run ALL jobs (or dispatch the workflow), never 'failed jobs only'"
            exit 1
          fi

          # 2. Provenance + manifest, computed from the TRIGGER sha — the
          #    source these binaries were built from, never whatever tip the
          #    manifest lands on below. The manifest replaces (and
          #    strengthens) the old .source-tree stamp: same tree hash, plus
          #    a sha256 pin per binary that the server VERIFIES at fetch
          #    time instead of a ledger nothing read.
          tree="$(git rev-parse "$TRIGGER_SHA:p2p-sidecar")"
          version="$(git show "$TRIGGER_SHA:p2p-sidecar/Cargo.toml" | sed -n 's/^version *= *"\(.*\)".*/\1/p' | head -1)"
          echo "source tree $tree (crate version ${version:-unknown})"
          manifest="$(mktemp)"
          node scripts/p2p-sidecar-manifest.mjs \
            --tag "$release_tag" --repo "$REPO" --tree "$tree" \
            --version "${version:-unknown}" --built-from "$TRIGGER_SHA" --run-url "$RUN_URL" \
            --staging staging --assets-dir assets --out "$manifest" \
            $names

          # 3. Ensure the rolling release exists, then upload what's new.
          #    Prerelease: it must never become `releases/latest` (that's
          #    the server-bundle path install.sh resolves). Asset names
          #    embed tree + content hashes, so an existing name IS the same
          #    bytes — skip exactly, replace never. `|| true` on create: a
          #    racing sibling (the musl workflow) may have just created it;
          #    the re-view is the real gate.
          if ! gh release view "$release_tag" --json tagName --jq .tagName >/dev/null 2>&1; then
            gh release create "$release_tag" --prerelease \
              --title "p2p-sidecar prebuilt binaries" \
              --notes "Machine-managed asset store for the p2p-sidecar build workflows. Binaries are addressed by the committed bin/p2p-sidecar/manifest*.json (sha256-verified at fetch). Assets are append-only under content-addressed names — do not delete or replace them; old manifests in git history resolve here forever." \
              || true
            gh release view "$release_tag" --json tagName --jq .tagName >/dev/null
          fi
          existing="$(gh release view "$release_tag" --json assets --jq '.assets[].name')"
          for f in assets/*; do
            name="$(basename "$f")"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              echo "asset already published (immutable name, same bytes): $name"
            else
              gh release upload "$release_tag" "$f"
              echo "uploaded: $name"
            fi
          done

          # 4. No-rebase loop for the MANIFEST file: land on the current
          #    tip, stand down if a newer p2p-sidecar/ tree already got
          #    there. Full rationale in build-rust-parser.yml's commit job —
          #    unchanged by the asset move, just a much smaller payload.
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin "$BRANCH"
            git checkout -q --detach FETCH_HEAD
            if ! git diff --quiet "$TRIGGER_SHA" FETCH_HEAD -- p2p-sidecar; then
              echo "master already carries a p2p-sidecar/ tree newer than $TRIGGER_SHA — that push's run owns this family's manifest; standing down without committing (this run's uploaded assets stay: unreferenced, immutable, harmless)"
              exit 0
            fi
            mkdir -p bin/p2p-sidecar
            cp "$manifest" "bin/p2p-sidecar/$manifest_file"
            git add "bin/p2p-sidecar/$manifest_file"
            if git diff --cached --quiet; then
              echo "No manifest changes to commit (master already pins this exact set)"
              exit 0
            fi
            git commit -q -m "ci: update p2p-sidecar release manifest"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed $(git rev-parse --short HEAD) onto $BRANCH"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — the tip moved; retrying from the new tip"
            git reset -q --hard FETCH_HEAD
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
