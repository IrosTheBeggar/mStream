# Monthly ffmpeg pin refresh: re-run scripts/update-ffmpeg-manifest.mjs,
# VERIFY every pinned asset (download + sha256 — the load-bearing check,
# because a PR created with GITHUB_TOKEN triggers no CI), and open/update a
# review PR when the pins moved. A human merges; nothing lands on master
# automatically.
#
# Why monthly: pins exist so Windows users keep a stable unsigned-binary
# hash that accrues SmartScreen / Smart App Control reputation — churning
# weekly would defeat that — while BtbN's bounded retention of dated
# releases means a pin left for a year could 404 for fresh installs.
# Monthly threads that needle. The 3rd-of-month at an odd minute dodges
# GitHub's first-of-month/on-the-hour cron congestion.
name: Update ffmpeg manifest

on:
  schedule:
    - cron: '23 8 3 * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'BtbN tag to pin (autobuild-YYYY-MM-DD-HH-MM); empty = newest dated autobuild'
        required: false
        default: ''

concurrency:
  group: update-ffmpeg-manifest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Regenerate + verify. --verify downloads all five pinned asset sets
      # (~500 MB) and hashes them against the pins; any miss fails the job
      # before a PR exists. GITHUB_TOKEN raises the API rate limit only.
      - name: Regenerate and verify the manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-ffmpeg-manifest.mjs ${{ inputs.tag }} --verify

      - name: Open or update the pin-bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bin/ffmpeg/manifest.json; then
            echo "pins already current — nothing to do"
            exit 0
          fi
          TAG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('bin/ffmpeg/manifest.json','utf8')).btbn.tag)")
          SUMMARY=$(git diff --stat -- bin/ffmpeg/manifest.json | tail -1)
          BRANCH=auto/ffmpeg-manifest-update
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add bin/ffmpeg/manifest.json
          git commit -m "chore(ffmpeg): bump pinned builds to ${TAG}

          Generated by the monthly update-ffmpeg-manifest workflow. Every
          pinned asset was downloaded and sha256-verified in the generating
          run (see the workflow logs) before this PR was opened."
          # Force-push: a stale unmerged bump is superseded in place — the
          # open PR (if any) simply updates to the newest pins.
          git push -f origin "$BRANCH"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)
          BODY="Monthly ffmpeg pin refresh: **${TAG}** (+ current martin-riedl macOS builds).

          Every pinned asset was **downloaded and sha256-verified** in the [generating run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — that run is the CI for this PR (a GITHUB_TOKEN-created PR triggers no workflows).

          \`${SUMMARY}\`

          Merging converges managed installs onto the new pins on their next local check; operator-supplied and frozen (\`transcode.autoUpdate=false\`) installs are untouched. Existing installs keep working either way — only the pins for *future* fetches change."
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY" --title "chore(ffmpeg): bump pinned builds to ${TAG}"
            gh pr comment "$EXISTING" --body "Updated to ${TAG}; assets re-verified in the latest run."
            echo "updated existing PR #$EXISTING"
          else
            gh pr create --base master --head "$BRANCH" \
              --title "chore(ffmpeg): bump pinned builds to ${TAG}" \
              --body "$BODY"
          fi
