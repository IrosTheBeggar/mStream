# Monthly yt-dlp pin refresh: re-run scripts/update-yt-dlp-manifest.mjs
# against yt-dlp's newest release, VERIFY every pinned asset (download +
# sha256 — the load-bearing check, because a PR created with GITHUB_TOKEN
# triggers no CI), and open/update a review PR when the pins moved. A human
# merges; nothing lands on master automatically.
#
# Why this exists at all when installs keep themselves current: the pin is
# what a FRESH install gets before its first daily check
# (src/util/yt-dlp-bootstrap.js) — and what an air-gapped or frozen
# (`discoveryPlugins.youtube.autoUpdate: false`) install runs for good. A
# monthly bump keeps that first fetch from starting far behind. Old pins
# stay valid forever (release assets are immutable), so a skipped month
# costs nothing. The 5th, an odd minute: off GitHub's first-of-month and
# on-the-hour cron congestion.
name: Update yt-dlp manifest

on:
  schedule:
    - cron: '41 7 5 * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'yt-dlp release to pin (e.g. 2026.08.19); empty = the newest release'
        required: false
        default: ''

concurrency:
  group: update-yt-dlp-manifest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The tag is operator input — token-validate it before it touches
      # anything (the script checks again; a clearer failure here).
      - name: Validate the tag
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$RAW_TAG" ] && ! printf '%s' "$RAW_TAG" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "::error::refusing tag '$RAW_TAG' — yt-dlp tags look like 2026.08.19"
            exit 1
          fi
          echo "TAG=$RAW_TAG" >> "$GITHUB_ENV"

      # Regenerate + verify: --verify downloads every pinned binary (~230 MB)
      # and hashes it against the release's SHA2-256SUMS; any miss fails the
      # job before a PR exists. GITHUB_TOKEN raises the API rate limit only.
      - name: Regenerate and verify the manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-yt-dlp-manifest.mjs $TAG --verify

      - name: Open or update the pin-bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bin/yt-dlp/manifest.json bin/yt-dlp/manifest-musl.json; then
            echo "pins already current — nothing to do"
            exit 0
          fi
          TAG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('bin/yt-dlp/manifest.json','utf8')).tag)")
          SUMMARY=$(git diff --stat -- bin/yt-dlp/manifest.json bin/yt-dlp/manifest-musl.json | tail -1)
          BRANCH=auto/yt-dlp-manifest-update
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add bin/yt-dlp/manifest.json bin/yt-dlp/manifest-musl.json
          git commit -m "chore(yt-dlp): bump the pinned release to ${TAG}

          Generated by the monthly update-yt-dlp-manifest workflow. Every
          pinned binary was downloaded and sha256-verified in the generating
          run (see the workflow logs) before this PR was opened."
          # Force-push: a stale unmerged bump is superseded in place — the
          # open PR (if any) simply updates to the newest pins.
          git push -f origin "$BRANCH"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)
          BODY="Monthly yt-dlp pin refresh: **${TAG}**.

          Every pinned binary was **downloaded and sha256-verified** against the release's own \`SHA2-256SUMS\` in the [generating run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — that run is the CI for this PR (a GITHUB_TOKEN-created PR triggers no workflows).

          \`${SUMMARY}\`

          The pin is what a *fresh* install fetches first; installs with updates on move to the newest release daily regardless, and operator-supplied or frozen (\`discoveryPlugins.youtube.autoUpdate: false\`) copies are untouched. Old pins stay valid forever."
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY" --title "chore(yt-dlp): bump the pinned release to ${TAG}"
            gh pr comment "$EXISTING" --body "Updated to ${TAG}; binaries re-verified in the latest run."
            echo "updated existing PR #$EXISTING"
          else
            gh pr create --base master --head "$BRANCH" \
              --title "chore(yt-dlp): bump the pinned release to ${TAG}" \
              --body "$BODY"
          fi
