# Player pin bump: when mstream-terminal-player publishes a release, its
# repo fires a repository_dispatch here (see the snippet in that repo's
# release workflow) and this regenerates bin/mstream-player/manifest.json
# via scripts/update-mstream-player-manifest.mjs — which DOWNLOADS and
# sha256-verifies every pinned binary before writing a pin (the
# load-bearing check, because a PR created with GITHUB_TOKEN triggers no
# CI) — then opens/updates a review PR. A human merges; nothing lands on
# master automatically, so a player release is never an implicit adoption
# decision for mStream.
#
# No schedule, unlike the ffmpeg twin: BtbN's bounded retention forces
# ffmpeg churn, but player releases are immutable — an old pin stays valid
# forever, so this only runs when poked (or by hand via workflow_dispatch,
# which is also the fallback when the player repo's PAT has expired).
name: Update mstream-player manifest

on:
  # TEMP TEST TRIGGER — removed before merge (new workflows cannot be
  # workflow_dispatched until they exist on the default branch; push runs
  # use the pushed ref's file, so this is the pre-merge test path).
  push:
    branches: [claude/player-manifest-automation]
  repository_dispatch:
    types: [player-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'player release tag to pin (e.g. v0.3.0)'
        required: true

concurrency:
  group: update-mstream-player-manifest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The tag arrives from another repo's event payload — token-validate
      # it here before it touches anything, mirroring the script's own
      # TOKEN_RE (defense in depth, and a clearer failure than the
      # script's).
      - name: Resolve and validate the tag
        env:
          # Injected via env, never inline in the script: the payload
          # crosses a repo boundary, and env is the interpolation-proof
          # channel.
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag || 'v0.3.0' }}  # TEMP: push-test fallback
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::refusing tag '$RAW_TAG' — not a plain token"
            exit 1
          fi
          echo "TAG=$RAW_TAG" >> "$GITHUB_ENV"

      # Regenerate + verify: the script downloads every platform binary in
      # the release and re-hashes it against the release's own manifest
      # before pinning; any miss fails the job before a PR exists.
      - name: Regenerate and verify the manifest
        run: node scripts/update-mstream-player-manifest.mjs "$TAG"

      - name: Open or update the pin-bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bin/mstream-player/manifest.json; then
            echo "pins already current — nothing to do"
            exit 0
          fi
          SUMMARY=$(git diff --stat -- bin/mstream-player/manifest.json | tail -1)
          BRANCH=auto/mstream-player-manifest-update
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add bin/mstream-player/manifest.json
          git commit -m "chore(mstream-player): bump pins to ${TAG}

          Generated by the update-mstream-player-manifest workflow. Every
          pinned binary was downloaded and sha256-verified in the
          generating run (see the workflow logs) before this PR was
          opened."
          # Force-push: a stale unmerged bump is superseded in place — the
          # open PR (if any) simply updates to the newest pins.
          git push -f origin "$BRANCH"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)
          BODY="mstream-terminal-player published **${TAG}** — this bumps mStream's pins to it.

          Every pinned binary was **downloaded and sha256-verified** in the [generating run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — that run is the CI for this PR (a GITHUB_TOKEN-created PR triggers no workflows), and the next tag's bundle build re-verifies each staged binary against these pins.

          \`${SUMMARY}\`

          Merging makes the next release bundles ship ${TAG} and points npm/source installs' fetch-on-first-use at it. Not merging costs nothing: old pins stay valid forever (release assets are immutable). Operator-placed binaries are untouched either way."
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY" --title "chore(mstream-player): bump pins to ${TAG}"
            gh pr comment "$EXISTING" --body "Updated to ${TAG}; binaries re-verified in the latest run."
            echo "updated existing PR #$EXISTING"
          else
            gh pr create --base master --head "$BRANCH" \
              --title "chore(mstream-player): bump pins to ${TAG}" \
              --body "$BODY"
          fi
