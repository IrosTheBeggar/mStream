name: Build Rust Parser Binaries

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + self-test only; do not commit the binaries'
        type: boolean
        default: false
  push:
    branches: [master]
    # This file too, so a change to how the binaries are built or STAMPED
    # re-lands the set (and its provenance stamp) right away — and the zig
    # toolchain pins + the floor checker, which decide what the Linux gnu
    # legs link against.
    paths:
      - 'rust-parser/**'
      - '.github/workflows/build-rust-parser.yml'
      - '.github/actions/setup-zigbuild/**'
      - 'scripts/check-glibc-floor.sh'

# Serialize runs of THIS workflow per ref: the commit job lands binaries on
# the master tip, and two interleaved runs of the same family would race to
# do it. cancel-in-progress stays false — a canceled run silently drops its
# binaries update. Sibling families (musl, other sidecars) keep their OWN
# groups on purpose: one shared group would cancel a sibling's pending
# update outright.
concurrency:
  group: build-rust-parser-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Linux gnu binaries' glibc floor. cargo-zigbuild links them against
  # exactly this glibc ABI (`--target <triple>.<version>`), whatever libc
  # the runner image carries: built natively on ubuntu-latest, the x64
  # scanner needed GLIBC_2.34 and could not even start on Debian 11 /
  # Ubuntu 20.04 / RHEL 8 hosts (the server itself runs on 2.17), so every
  # scan there fell back. Asserted on each built binary below and again on
  # the bundles by build-bun.yml, whose GLIBC_FLOOR must be the same number;
  # docs/install.md states it to users.
  GLIBC_FLOOR: '2.28'
  # glibc 2.28 exactly: where the Linux gnu self-tests run. Pinned by digest
  # (a smoke input, never a build input); amd64, arm64v8 and armv7 variants,
  # so every leg's binary runs on the floor it claims.
  FLOOR_IMAGE: debian:10-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # self_test: run the freshly built binary before committing it (see the
        # "Self-test" step) — natively (windows-x64, darwin-arm64) or via
        # Rosetta 2 (darwin-x64 on the arm64 runner). The Linux gnu legs
        # (zig: true, linked against GLIBC_FLOOR) run theirs inside the
        # FLOOR_IMAGE container on test_platform — x64 directly, the two ARM
        # ones under QEMU — so a binary that needs a newer glibc than it
        # claims, or that cannot run on its CPU at all, never lands.
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_name: rust-parser-win32-x64.exe
            self_test: true

          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: rust-parser-darwin-x64
            self_test: true

          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: rust-parser-darwin-arm64
            self_test: true

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: rust-parser-linux-x64
            zig: true
            self_test: true
            test_platform: linux/amd64

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: rust-parser-linux-arm64
            zig: true
            self_test: true
            test_platform: linux/arm64

          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            binary_name: rust-parser-linux-arm
            zig: true
            self_test: true
            test_platform: linux/arm/v7

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-parser
          # -zig: objects compiled and linked through zig never share a
          # cache with a native build's.
          key: ${{ matrix.target }}${{ matrix.zig && '-zig' || '' }}

      - name: Set up cargo-zigbuild (Linux gnu legs)
        if: matrix.zig
        uses: ./.github/actions/setup-zigbuild

      - name: Build
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}.$GLIBC_FLOOR" --manifest-path rust-parser/Cargo.toml
          else
            cargo build --release --locked --target ${{ matrix.target }} --manifest-path rust-parser/Cargo.toml
          fi
        shell: bash

      - name: Rename binary
        run: |
          src="rust-parser/target/${{ matrix.target }}/release/rust-parser"
          if [[ "${{ matrix.binary_name }}" == *.exe ]]; then
            src="${src}.exe"
          fi
          mkdir -p staging
          cp "$src" "staging/${{ matrix.binary_name }}"
        shell: bash

      # The floor is a build input, so a binary above it can only mean the
      # toolchain changed under us — refuse it here, before a self-test on
      # the (newer) runner could pass it.
      - name: Assert the glibc floor (Linux gnu legs)
        if: matrix.zig
        run: scripts/check-glibc-floor.sh "$GLIBC_FLOOR" "staging/${{ matrix.binary_name }}"

      # binfmt handlers so the x64 host runs the ARM legs' containers under
      # qemu-user — the musl workflow's mechanism for its static ARM
      # binaries; here the container supplies the glibc a gnu binary needs.
      - name: Set up QEMU (ARM self-tests)
        if: matrix.test_platform && matrix.test_platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      # Gate the commit on the freshly built binary actually executing. A
      # binary that can't launch (bad arch / unsigned / dyld or SDK mismatch /
      # a glibc symbol newer than the host's) prints nothing — which is
      # exactly how a broken darwin-arm64 binary once shipped silently. The
      # file content is irrelevant: a zero-filled blob is enough for the
      # binary to launch, read it, MD5 it, and emit JSON, which proves the
      # executable is sound. If this fails, the leg fails and commit-binaries
      # (needs: build) is skipped, so the bad binary never lands.
      - name: Self-test the freshly built binary
        if: matrix.self_test
        shell: bash
        run: |
          bin="staging/${{ matrix.binary_name }}"
          head -c 100000 /dev/zero > staging/sample.mp3
          if [ -n "${{ matrix.test_platform }}" ]; then
            echo "self-testing: $bin in $FLOOR_IMAGE (${{ matrix.test_platform }})"
            run() { docker run --rm --platform "${{ matrix.test_platform }}" -v "$PWD/staging:/s:ro" "$FLOOR_IMAGE" "/s/${{ matrix.binary_name }}" "$@"; }
            sample=/s/sample.mp3
          else
            echo "self-testing: $bin"
            run() { "$bin" "$@"; }
            sample=staging/sample.mp3
          fi
          out="$(run --audio-hash "$sample")"
          echo "  --audio-hash: $out"
          echo "$out" | grep -q '"fileHash":"' \
            || { echo "::error::self-test: --audio-hash produced no/invalid output"; exit 1; }
          wf="$(run --waveform "$sample")"
          echo "  --waveform: ${wf:0:60}"
          echo "$wf" | grep -q '"bars":' \
            || { echo "::error::self-test: --waveform produced no/invalid output"; exit 1; }
          rm -f staging/sample.mp3
          echo "self-test passed: ${{ matrix.binary_name }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: staging/${{ matrix.binary_name }}
          # 7, not 1: the commit job refuses to land a PARTIAL set (inventory
          # below), so a next-day re-run must still find every leg's artifact
          # — with 1-day retention it would find one fresh + the rest expired
          # and could only fail.
          retention-days: 7

  commit-binaries:
    name: Commit binaries
    needs: build
    # Skipped on a dry-run dispatch (build + self-test only).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Into a scratch dir, NOT bin/: the inventory below must see exactly
      # what this run built (downloading over bin/ let a partial set silently
      # keep the previous binaries for the missing legs under a fresh stamp),
      # and the no-rebase loop below re-checkouts the tip, which needs a
      # clean worktree. Same design as build-rust-launcher.yml (#840).
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true

      - name: Commit and push
        env:
          TRIGGER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Inventory: every glibc-family binary, non-empty. Anything less
          #    is not a set this sha built — refuse rather than stamp it.
          names="rust-parser-win32-x64.exe rust-parser-darwin-x64 rust-parser-darwin-arm64 rust-parser-linux-x64 rust-parser-linux-arm64 rust-parser-linux-arm"
          missing=""
          for name in $names; do
            [ -s "staging/$name" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::not all rust-parser binaries were built by this run (missing:$missing) — an artifact expired or a leg was skipped; re-run ALL jobs (or dispatch the workflow), never 'failed jobs only'"
            exit 1
          fi

          # 2. Provenance stamp: the rust-parser/ source TREE these binaries
          #    were built from, computed from the TRIGGER sha — never from
          #    whatever master tip we commit onto below. build-bun's tag
          #    build asserts it against the tag's own tree, so a tag cut
          #    inside a rebuild window — or a hand-committed binary — is a
          #    red run instead of a scanner shipped (and soon signed) that
          #    doesn't correspond to the tagged source. The musl workflow
          #    writes its own file (.source-tree-musl): disjoint paths.
          stamp="$(mktemp)"
          git rev-parse "$TRIGGER_SHA:rust-parser" > "$stamp"
          echo "stamp for $TRIGGER_SHA:"; sed 's/^/  /' "$stamp"

          # 3. Land on the CURRENT tip and commit there — never rebase a
          #    binaries commit. A queued run of THIS workflow checks out its
          #    own, older trigger sha; rebasing its commit onto a tip that
          #    already carries a newer run's binaries conflicts on every file
          #    (binaries can't be merged), the job goes red, and master keeps
          #    whatever was there. Instead: fetch the tip, stand down if a
          #    newer rust-parser/ tree already landed on it (the run for that
          #    newer sha owns this family's files — it has run, or will),
          #    else put OUR set on top of the tip. Sibling families (musl,
          #    other sidecars) racing this push only ever reject it — the
          #    retry re-applies our disjoint file set on their new tip.
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin "$BRANCH"
            git checkout -q --detach FETCH_HEAD
            if ! git diff --quiet "$TRIGGER_SHA" FETCH_HEAD -- rust-parser; then
              echo "master already carries a rust-parser/ tree newer than $TRIGGER_SHA — that push's run owns this family's binaries; standing down without committing"
              exit 0
            fi
            for name in $names; do
              cp "staging/$name" "bin/rust-parser/$name"
              # Artifact zips strip the mode: restore on disk AND force
              # 100755 in the index — without +x, scanners spawn the binary
              # and hit EACCES on every boot.
              chmod +x "bin/rust-parser/$name"
              git add "bin/rust-parser/$name"
              git update-index --chmod=+x "bin/rust-parser/$name"
            done
            cp "$stamp" bin/rust-parser/.source-tree
            git add bin/rust-parser/.source-tree
            if git diff --cached --quiet; then
              echo "No binary changes to commit (master already has this exact set)"
              exit 0
            fi
            git commit -q -m "ci: update pre-built rust-parser binaries"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed $(git rev-parse --short HEAD) onto $BRANCH"
              exit 0
            fi
            # Someone (a sibling binary workflow, a merge) pushed between our
            # fetch and our push: drop our commit and go again from the new tip.
            echo "push rejected (attempt $attempt) — the tip moved; retrying from the new tip"
            git reset -q --hard FETCH_HEAD
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
