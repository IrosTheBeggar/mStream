# Builds statically-linked musl p2p-sidecar binaries for Alpine Linux and
# other musl-libc distros — most importantly the linuxserver.io Docker image
# (Alpine base), where the discovery network was previously dead on arrival:
# the Node client correctly resolves `p2p-sidecar-linux-<arch>-musl` on musl
# hosts, but no such binaries existed. cross-rs for every leg, every leg
# self-tested (x64 natively, ARM under qemu-user — static binaries need no
# sysroot). PRs stay source-only.
#
# Delivery: GitHub RELEASE assets + a committed text manifest, NOT binaries
# in git — see build-p2p-sidecar.yml's header for the full model. This
# workflow uploads to the SAME rolling `p2p-sidecar-assets` release but owns
# its own manifest file (bin/p2p-sidecar/manifest-musl.json), so the two
# publishers never write the same path (the old .source-tree /
# .source-tree-musl stamp split, carried forward).
#
# The sidecar's crypto stack is ring-only (no aws-lc-rs anywhere in the
# lock file), which cross's musl images build without extra toolchain work.
name: Build P2P Sidecar Binaries (musl)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + self-test only; do not publish assets or commit the manifest'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'p2p-sidecar/**'
      - '.github/workflows/build-p2p-sidecar-musl.yml'
      - 'scripts/p2p-sidecar-manifest.mjs'

# Serialize runs of THIS workflow per ref (see build-rust-parser.yml — same
# rationale; sibling families keep their own groups on purpose).
concurrency:
  group: build-p2p-sidecar-musl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            binary_name: p2p-sidecar-linux-x64-musl

          - target: aarch64-unknown-linux-musl
            binary_name: p2p-sidecar-linux-arm64-musl
            emulate: true

          - target: armv7-unknown-linux-musleabihf
            binary_name: p2p-sidecar-linux-arm-musl
            emulate: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: p2p-sidecar
          key: ${{ matrix.target }}

      - name: Install cross
        run: |
          # Pinned + hashed, same as the glibc workflow (and the other
          # sidecar families since #841): `releases/latest` piped straight
          # into ~/.cargo/bin meant a new (or hijacked) cross release ran on
          # the next master push and produced the SHIPPED musl binaries —
          # this workflow was the last one still floating. Bump the version
          # and the sha256 together (sha256sum of the release asset).
          curl -fsSL -o cross.tar.gz "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz"
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  cross.tar.gz" | sha256sum -c -
          tar xzf cross.tar.gz -C "$HOME/.cargo/bin" && rm cross.tar.gz

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }} --manifest-path p2p-sidecar/Cargo.toml

      - name: Stage binary
        run: |
          mkdir -p staging
          cp "p2p-sidecar/target/${{ matrix.target }}/release/p2p-sidecar" "staging/${{ matrix.binary_name }}"
          chmod +x "staging/${{ matrix.binary_name }}"

      # Register binfmt handlers so the x64 host can transparently execute the
      # foreign-arch static musl binaries via qemu-user.
      - name: Set up QEMU
        if: matrix.emulate
        uses: docker/setup-qemu-action@v3

      # --print-id is the sidecar's one-shot CI mode: create an identity,
      # print the derived endpoint id (64 hex chars), exit — no sockets, no
      # network. Proves the executable launches and its crypto stack works.
      # Unlike the gnu workflow's unverified cross ARM legs, ALL musl legs
      # self-test here (static binaries run under qemu with no sysroot) — a
      # binary that can't execute never reaches the commit job.
      - name: Self-test the freshly built binary
        shell: bash
        run: |
          bin="staging/${{ matrix.binary_name }}"
          echo "self-testing: $bin"
          out="$("$bin" --print-id --data-dir selftest-data)"
          echo "  --print-id: $out"
          echo "$out" | grep -Eq '^[0-9a-f]{64}$' \
            || { echo "::error::self-test: --print-id produced no/invalid output"; exit 1; }
          # Second run must load the SAME identity from disk, not mint a new one.
          out2="$("$bin" --print-id --data-dir selftest-data)"
          [ "$out" = "$out2" ] \
            || { echo "::error::self-test: identity did not persist between runs"; exit 1; }
          # Real-run smoke: --print-id never opens a socket, so it misses
          # runtime breakage in the QUIC/UDP layer — noq-udp 1.1.0's musl
          # cmsg-alignment assert (2026-07, SIGABRT at endpoint bind on the
          # Alpine Docker image) sailed straight through the identity checks
          # above. Run the sidecar for real: with stdin at EOF it emits the
          # 'ready' event (right after the endpoint binds — no relay
          # round-trip) and then exits cleanly on its own.
          set +e
          real_out="$(timeout 30 "$bin" --data-dir smoke-data </dev/null 2>&1)"
          real_code=$?
          set -e
          echo "  real-run exit=$real_code"
          echo "$real_out" | head -3
          echo "$real_out" | grep -q '"event":"ready"' \
            || { echo "::error::real-run smoke: no ready event before exit"; exit 1; }
          [ "$real_code" -eq 0 ] \
            || { echo "::error::real-run smoke: sidecar exited $real_code (expected clean EOF shutdown)"; exit 1; }
          echo "self-test passed: ${{ matrix.binary_name }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: staging/${{ matrix.binary_name }}
          # 7, not 1: the commit job refuses a partial set (see there).
          retention-days: 7

  publish:
    name: Publish assets + manifest
    needs: build
    # Skipped on a dry-run dispatch (build + self-test only).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Into a scratch dir, NOT bin/ — see build-rust-parser.yml's commit
      # job: the inventory must see exactly what this run built, and the
      # no-rebase loop re-checkouts the tip, which needs a clean worktree.
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true

      # Assets BEFORE manifest — see build-p2p-sidecar.yml (a committed
      # manifest must never point at an asset that isn't uploaded yet).
      - name: Upload release assets and commit the manifest
        env:
          TRIGGER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          release_tag="p2p-sidecar-assets"
          manifest_file="manifest-musl.json"
          names="p2p-sidecar-linux-x64-musl p2p-sidecar-linux-arm64-musl p2p-sidecar-linux-arm-musl"

          # 1. Inventory: the full musl set, non-empty (see build-rust-parser.yml).
          missing=""
          for name in $names; do
            [ -s "staging/$name" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::not all p2p-sidecar musl binaries were built by this run (missing:$missing) — an artifact expired or a leg was skipped; re-run ALL jobs (or dispatch the workflow), never 'failed jobs only'"
            exit 1
          fi

          # 2. Provenance + manifest from the TRIGGER sha (the manifest
          #    replaces the old ledger-only .source-tree-musl stamp with
          #    pins the server verifies at fetch time).
          tree="$(git rev-parse "$TRIGGER_SHA:p2p-sidecar")"
          version="$(git show "$TRIGGER_SHA:p2p-sidecar/Cargo.toml" | sed -n 's/^version *= *"\(.*\)".*/\1/p' | head -1)"
          echo "source tree $tree (crate version ${version:-unknown})"
          manifest="$(mktemp)"
          node scripts/p2p-sidecar-manifest.mjs \
            --tag "$release_tag" --repo "$REPO" --tree "$tree" \
            --version "${version:-unknown}" --built-from "$TRIGGER_SHA" --run-url "$RUN_URL" \
            --staging staging --assets-dir assets --out "$manifest" \
            $names

          # 3. Ensure the rolling release exists, upload what's new (skip
          #    existing names — same bytes by construction, never replace).
          #    `|| true` on create: the glibc workflow may have just created
          #    it; the re-view is the real gate.
          if ! gh release view "$release_tag" --json tagName --jq .tagName >/dev/null 2>&1; then
            gh release create "$release_tag" --prerelease \
              --title "p2p-sidecar prebuilt binaries" \
              --notes "Machine-managed asset store for the p2p-sidecar build workflows. Binaries are addressed by the committed bin/p2p-sidecar/manifest*.json (sha256-verified at fetch). Assets are append-only under content-addressed names — do not delete or replace them; old manifests in git history resolve here forever." \
              || true
            gh release view "$release_tag" --json tagName --jq .tagName >/dev/null
          fi
          existing="$(gh release view "$release_tag" --json assets --jq '.assets[].name')"
          for f in assets/*; do
            name="$(basename "$f")"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              echo "asset already published (immutable name, same bytes): $name"
            else
              gh release upload "$release_tag" "$f"
              echo "uploaded: $name"
            fi
          done

          # 4. No-rebase loop for the MANIFEST file: land on the current
          #    tip, stand down if a newer p2p-sidecar/ tree already got
          #    there. Full rationale in build-rust-parser.yml's commit job.
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin "$BRANCH"
            git checkout -q --detach FETCH_HEAD
            if ! git diff --quiet "$TRIGGER_SHA" FETCH_HEAD -- p2p-sidecar; then
              echo "master already carries a p2p-sidecar/ tree newer than $TRIGGER_SHA — that push's run owns this family's manifest; standing down without committing (this run's uploaded assets stay: unreferenced, immutable, harmless)"
              exit 0
            fi
            mkdir -p bin/p2p-sidecar
            cp "$manifest" "bin/p2p-sidecar/$manifest_file"
            git add "bin/p2p-sidecar/$manifest_file"
            if git diff --cached --quiet; then
              echo "No manifest changes to commit (master already pins this exact set)"
              exit 0
            fi
            git commit -q -m "ci: update p2p-sidecar musl release manifest"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed $(git rev-parse --short HEAD) onto $BRANCH"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — the tip moved; retrying from the new tip"
            git reset -q --hard FETCH_HEAD
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
