name: Test

on:
  # The heavy 9-job matrix runs only when a PR is labelled `full-ci` — i.e. once
  # you mark it ready to merge — not on every push. (Merge queue would be the
  # native "before merge" trigger, but it's org-only and this repo is on a
  # personal account.) Require the "tests passed" check in branch protection so
  # a PR can't merge until it's been labelled `full-ci` and the run is green.
  pull_request:
    types: [labeled]
  # Manual escape hatch — run on demand from the Actions tab or
  # `gh workflow run test.yml --ref <branch>`.
  workflow_dispatch:

# Re-labelling the same PR cancels its prior in-flight run (each PR has its own
# ref); runs for different PRs never cancel each other.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} · ${{ matrix.shard }}/3)
    # Only on the `full-ci` label or a manual dispatch — never plain PR pushes.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Don't let one OS failing cancel the others — we want the full matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Split the suite across 3 shards per OS — node --test partitions the
        # files, so the ~32 server-booting tests run in parallel across jobs.
        shard: [1, 2, 3]

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Bun runtime, for the supervision suite's bun legs — the shipped
      # standalone binaries are Bun builds, so the lost-supervision behavior
      # (test/integration/supervision-shutdown.test.mjs) is asserted on that
      # runtime too. Those legs skip wherever bun is absent. Pinned to the
      # version build-bun.yml compiles releases with, so the legs assert the
      # runtime users actually get — bump the two pins together.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # ffmpeg sources differ per OS: version-pinned, checksum-verified static
      # builds fetched from GitHub-CDN mirrors on Linux (BtbN) and Windows
      # (gyan.dev); Homebrew on macOS (arm64 runner — handled separately
      # below).

      # Deterministic for the same reason as the Windows leg below — the apt
      # install this replaced hung on a stalled Ubuntu-mirror fetch until the
      # 30-minute job timeout killed the shard (PR #779, run 30360260306:
      # 22+ min inside apt-get while the sibling shards' installs took ~20 s).
      # Same shape as Windows: pinned tag + sha256, curl retries, fail-loud
      # libvorbis assert (the suite encodes .ogg fixtures). Bump: BtbN prunes
      # daily autobuild-* tags after ~2 weeks but keeps each month-end tag
      # long-term (~2 years observed) — pick a MONTH-END tag and a versioned
      # (ffmpeg-nX.Y.Z-…) linux64-gpl asset from it, then update the sha256
      # (compute locally: sha256sum on the downloaded tar).
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tag='autobuild-2026-06-30-13-34'
          build='ffmpeg-n8.1.2-21-gce3c09c101-linux64-gpl-8.1'
          sha256='0ba73bbd93472c7622f6dec26d334c5e62e64d858d072490b2844320970456cd'
          curl -fsSL --retry 3 --retry-delay 5 -o "$build.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$build.tar.xz"
          echo "$sha256  $build.tar.xz" | sha256sum -c - \
            || { echo "::error::ffmpeg download checksum mismatch"; exit 1; }
          tar -xf "$build.tar.xz"
          mkdir -p bin/ffmpeg
          cp "$build/bin/ffmpeg"  bin/ffmpeg/ffmpeg
          cp "$build/bin/ffprobe" bin/ffmpeg/ffprobe
          chmod +x bin/ffmpeg/ffmpeg bin/ffmpeg/ffprobe
          bin/ffmpeg/ffmpeg -hide_banner -encoders | grep -qi libvorbis \
            || { echo "::error::Linux ffmpeg is missing the libvorbis encoder"; exit 1; }
          rm -rf "$build.tar.xz" "$build"

      # Deterministic on purpose: the setup-ffmpeg action this replaced
      # resolved "latest release" through a remote lookup on EVERY run, and
      # one flake of that lookup ("Cannot get latest release") killed all
      # three Windows shards before a single test ran (PR #777). A pinned
      # tag + sha256 has exactly one failure mode — the download itself —
      # which curl retries and a checksum guards. The full build bundles
      # libvorbis (the suite encodes .ogg fixtures); asserted below like the
      # macOS leg. Bump: pick a tag from GyanD/codexffmpeg releases, update
      # the sha256 (compute locally: sha256sum on the downloaded zip), and
      # keep the libvorbis assert green.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = '8.1.2'
          $sha256 = 'b8cdefab5f50590a076c27c2b56b0294a0e6154faded28ba1ba05ebc4f801f57'
          $zip = "ffmpeg-$tag-full_build.zip"
          curl.exe -fsSL --retry 3 --retry-delay 5 -o $zip `
            "https://github.com/GyanD/codexffmpeg/releases/download/$tag/$zip"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::ffmpeg download failed (curl exit $LASTEXITCODE)"
            exit 1
          }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) {
            Write-Host "::error::ffmpeg download checksum mismatch (got $actual, want $sha256)"
            exit 1
          }
          tar -xf $zip
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::ffmpeg archive extraction failed"
            exit 1
          }
          New-Item -ItemType Directory -Force bin/ffmpeg | Out-Null
          Copy-Item "ffmpeg-$tag-full_build/bin/ffmpeg.exe"  bin/ffmpeg/ffmpeg.exe
          Copy-Item "ffmpeg-$tag-full_build/bin/ffprobe.exe" bin/ffmpeg/ffprobe.exe
          $enc = & bin/ffmpeg/ffmpeg.exe -hide_banner -encoders
          if (-not ($enc | Select-String -Quiet libvorbis)) {
            Write-Host "::error::Windows ffmpeg is missing the libvorbis encoder"
            exit 1
          }
          Remove-Item $zip, "ffmpeg-$tag-full_build" -Recurse -Force

      # Homebrew-core ffmpeg (8.x) dropped libvorbis, but the suite encodes
      # .ogg fixtures with it. The homebrew-ffmpeg tap ships a full-codec build
      # (with libvorbis) and provides bottles, so this stays fast.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install homebrew-ffmpeg/ffmpeg/ffmpeg

      # The fixture generator (and the server's transcoder) look for ffmpeg at
      # bin/ffmpeg/ — the bundled binary is gitignored, so it isn't in the
      # checkout. The Linux and Windows steps above install straight into
      # bin/ffmpeg/; macOS stages Homebrew's ffmpeg here. Use Homebrew's build
      # explicitly — the runner's preinstalled ffmpeg (which `command -v` may
      # resolve first) lacks libvorbis, and the suite generates .ogg fixtures.
      # Fail loudly if the codec is missing.
      - name: Stage ffmpeg into bin/ffmpeg/ (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p bin/ffmpeg
          ff="$(brew --prefix)/bin"
          "$ff/ffmpeg" -hide_banner -encoders | grep -qi libvorbis \
            || { echo "::error::macOS ffmpeg is missing the libvorbis encoder"; exit 1; }
          cp "$ff/ffmpeg"  bin/ffmpeg/ffmpeg
          cp "$ff/ffprobe" bin/ffmpeg/ffprobe
          chmod +x bin/ffmpeg/ffmpeg bin/ffmpeg/ffprobe

      - name: Install dependencies
        run: npm ci

      # Build rust-parser FROM THIS PR'S SOURCE — but only when the committed
      # bin/ binaries don't already carry exactly this source.
      #
      # Why the build exists at all: the committed bin/ binaries are rebuilt by
      # CI only AFTER a merge to master, so on a PR that CHANGES the Rust
      # scanner they are one generation stale — and the capability-probed
      # suites (sampled hashes, hash-generation migration) would silently SKIP
      # their Rust halves, leaving the JS↔Rust hash parity contract unverified
      # at the exact moment it's being changed. The test helper prefers
      # rust-parser/target/release over bin/, so the build puts the PR's own
      # scanner under test on every OS.
      #
      # Why it can be skipped: build-rust-parser.yml stamps each committed set
      # with the rust-parser/ source TREE it was built from. When that stamp
      # equals this checkout's tree hash, the shipped binary IS this PR's
      # source — compiling it again produces the same scanner and the fallback
      # in scanner-runner.mjs:37-47 / ensure-prereqs.mjs:32-38 resolves it on
      # every OS. This is the same staleness test the suite itself already
      # trusts (scanner-runner.mjs:72-83 rustParserIsStale).
      #
      # BOTH stamps must match, because the runners resolve DIFFERENT binaries:
      # Linux takes the -musl set (scanner-runner.mjs:39 appends `-musl` on
      # linux) stamped by .source-tree-musl, while Windows and macOS take the
      # plain set stamped by .source-tree. Checking only one would skip the
      # build on a matrix leg whose binary is stale.
      #
      # FAILS CLOSED: no git, a missing/unreadable stamp, or any mismatch all
      # fall through to `build=true`. The only way to skip is an exact tree-hash
      # match on both stamps. ~8 of the last 159 merges touched rust-parser/, so
      # this skips a 73-198s compile on the large majority of PRs.
      - name: Is the committed rust-parser already this PR's source?
        id: rustparser
        shell: bash
        run: |
          want="$(git rev-parse HEAD:rust-parser 2>/dev/null || echo unknown)"
          have="$(cat bin/rust-parser/.source-tree 2>/dev/null || echo none)"
          have_musl="$(cat bin/rust-parser/.source-tree-musl 2>/dev/null || echo none)"
          echo "tree=$want stamp=$have stamp-musl=$have_musl"
          if [ "$want" != unknown ] && [ "$want" = "$have" ] && [ "$want" = "$have_musl" ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Committed rust-parser matches this PR's source ($want) — skipping cargo build."
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo "::notice::Building rust-parser from source (tree $want, stamps $have / $have_musl)."
          fi

      # rust-cache keys off Cargo.lock; warm runs restore in seconds.
      - name: Rust build cache
        if: steps.rustparser.outputs.build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-parser

      # --locked so a drifted Cargo.lock fails loudly instead of being silently
      # updated, matching build-rust-parser.yml:103.
      - name: Build rust-parser from source
        if: steps.rustparser.outputs.build == 'true'
        working-directory: rust-parser
        run: cargo build --release --locked

      # Whichever path ran, a usable scanner must be on disk — otherwise the
      # capability-probed suites would skip their Rust halves and the matrix
      # would go green having never exercised the scanner. ensure-prereqs only
      # soft-warns, so assert here.
      - name: Assert a rust-parser is resolvable
        shell: bash
        run: |
          node -e '
            const { findRustParser, rustParserIsStale } = await import("./test/helpers/scanner-runner.mjs");
            const bin = findRustParser();
            if (!bin) { console.error("::error::no rust-parser resolved"); process.exit(1); }
            if (rustParserIsStale(bin)) { console.error(`::error::resolved a STALE rust-parser: ${bin}`); process.exit(1); }
            console.log(`rust-parser: ${bin}`);
          ' --input-type=module

      # Build the fixture library once (normally npm's `pretest`), then run this
      # shard. The freshly built rust-parser above drives the scanner-parity
      # tests on every OS; the committed bin/ binaries remain the fallback for
      # local runs without a toolchain.
      - name: Build fixtures
        run: npm run pretest

      # Windows runners have 4 vCPUs, and node's default of three parallel
      # files lets the heavy suites (downloader worker, hash vectors, move
      # re-homing) starve a sibling's server boot past its 90 s budget — the
      # recurring windows-latest 1/3 cancellation ("server not ready: fetch
      # failed" with every other boot in the shard fine). Two files at a time
      # there; the 30-minute job budget has room (the shard took ~13 min at
      # three). Linux and macOS have not shown the starvation and keep the
      # default.
      - name: Run tests (shard ${{ matrix.shard }}/3)
        run: node --test --test-reporter=spec --test-shard=${{ matrix.shard }}/3 ${{ runner.os == 'Windows' && '--test-concurrency=2' || '' }} "test/**/*.test.mjs"

  # One stable check to require in branch protection / the merge queue — green
  # only when every matrix leg passed. Lets you require a single name instead of
  # all 9, which change whenever the OS or shard list does.
  tests-passed:
    name: tests passed
    # Mirror the gate so this check only exists when the matrix ran; always()
    # makes it still report (and fail) if a shard failed.
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci')
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::test matrix did not pass (result: ${{ needs.test.result }})"
            exit 1
          fi
          echo "all shards green"
