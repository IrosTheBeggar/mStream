name: Build Rust Parser Binaries (musl)

# Produces statically-linked musl binaries that run on Alpine Linux,
# Void Linux, distroless musl images, and any other musl-libc distro.
# Uses cross-rs/cross for all targets — same pattern as build-rust-parser.yml.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + self-test only; do not commit the binaries'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'rust-parser/**'
      - '.github/workflows/build-rust-parser-musl.yml'

# Serialize runs of THIS workflow per ref (see build-rust-parser.yml — same
# rationale; sibling families keep their own groups on purpose).
concurrency:
  group: build-rust-parser-musl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every leg is self-tested before commit (see the "Self-test" step).
        # These binaries are STATICALLY linked, so the x64 host can run them
        # all: x64-musl natively, and the ARM ones (emulate: true) under
        # qemu-user with no sysroot. (build-rust-parser.yml leaves its cross
        # ARM *gnu* legs unverified because dynamic glibc would need a sysroot
        # under qemu — static musl has no such issue.)
        include:
          - target: x86_64-unknown-linux-musl
            binary_name: rust-parser-linux-x64-musl

          - target: aarch64-unknown-linux-musl
            binary_name: rust-parser-linux-arm64-musl
            emulate: true

          - target: armv7-unknown-linux-musleabihf
            binary_name: rust-parser-linux-arm-musl
            emulate: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-parser
          key: ${{ matrix.target }}

      - name: Install cross
        run: |
          # Pinned + hashed: `releases/latest` piped straight into ~/.cargo/bin
          # meant a new (or hijacked) cross release ran on the next master push
          # and produced the shipped ARM/musl binaries. Bump the version and
          # the sha256 together (sha256sum of the release asset).
          curl -fsSL -o cross.tar.gz "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz"
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  cross.tar.gz" | sha256sum -c -
          tar xzf cross.tar.gz -C "$HOME/.cargo/bin" && rm cross.tar.gz

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }} --manifest-path rust-parser/Cargo.toml

      - name: Stage binary
        run: |
          mkdir -p staging
          cp "rust-parser/target/${{ matrix.target }}/release/rust-parser" "staging/${{ matrix.binary_name }}"
          chmod +x "staging/${{ matrix.binary_name }}"

      # Register binfmt handlers so the x64 host can transparently execute the
      # foreign-arch (aarch64 / armv7) static musl binaries via qemu-user.
      - name: Set up QEMU
        if: matrix.emulate
        uses: docker/setup-qemu-action@v3

      # Gate the commit on the freshly built binary actually executing — the
      # same guard as build-rust-parser.yml, now covering all three musl legs
      # (x64 natively, ARM under qemu). A binary that can't run prints nothing;
      # on failure the leg fails and commit-binaries (needs: build) is skipped.
      - name: Self-test the freshly built binary
        shell: bash
        run: |
          bin="staging/${{ matrix.binary_name }}"
          echo "self-testing: $bin"
          head -c 100000 /dev/zero > sample.mp3
          out="$("$bin" --audio-hash sample.mp3)"
          echo "  --audio-hash: $out"
          echo "$out" | grep -q '"fileHash":"' \
            || { echo "::error::self-test: --audio-hash produced no/invalid output"; exit 1; }
          wf="$("$bin" --waveform sample.mp3)"
          echo "  --waveform: ${wf:0:60}"
          echo "$wf" | grep -q '"bars":' \
            || { echo "::error::self-test: --waveform produced no/invalid output"; exit 1; }
          echo "self-test passed: ${{ matrix.binary_name }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: staging/${{ matrix.binary_name }}
          # 7, not 1: the commit job refuses a partial set (see there).
          retention-days: 7

  commit-binaries:
    name: Commit binaries
    needs: build
    # Skipped on a dry-run dispatch (build + self-test only).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Into a scratch dir, NOT bin/ — see build-rust-parser.yml's commit
      # job: the inventory must see exactly what this run built, and the
      # no-rebase loop re-checkouts the tip, which needs a clean worktree.
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true

      - name: Commit and push
        env:
          TRIGGER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Inventory: the full musl set, non-empty (see build-rust-parser.yml).
          names="rust-parser-linux-x64-musl rust-parser-linux-arm64-musl rust-parser-linux-arm-musl"
          missing=""
          for name in $names; do
            [ -s "staging/$name" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::not all rust-parser musl binaries were built by this run (missing:$missing) — an artifact expired or a leg was skipped; re-run ALL jobs (or dispatch the workflow), never 'failed jobs only'"
            exit 1
          fi

          # 2. Provenance stamp for the musl set from the TRIGGER sha — its
          #    own file so this workflow and build-rust-parser.yml never
          #    write the same path.
          stamp="$(mktemp)"
          git rev-parse "$TRIGGER_SHA:rust-parser" > "$stamp"
          echo "stamp for $TRIGGER_SHA:"; sed 's/^/  /' "$stamp"

          # 3. No-rebase loop: land on the current tip, stand down if a newer
          #    rust-parser/ tree already got there. Full rationale in
          #    build-rust-parser.yml's commit job.
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin "$BRANCH"
            git checkout -q --detach FETCH_HEAD
            if ! git diff --quiet "$TRIGGER_SHA" FETCH_HEAD -- rust-parser; then
              echo "master already carries a rust-parser/ tree newer than $TRIGGER_SHA — that push's run owns this family's binaries; standing down without committing"
              exit 0
            fi
            for name in $names; do
              cp "staging/$name" "bin/rust-parser/$name"
              chmod +x "bin/rust-parser/$name"
              git add "bin/rust-parser/$name"
              git update-index --chmod=+x "bin/rust-parser/$name"
            done
            cp "$stamp" bin/rust-parser/.source-tree-musl
            git add bin/rust-parser/.source-tree-musl
            if git diff --cached --quiet; then
              echo "No binary changes to commit (master already has this exact set)"
              exit 0
            fi
            git commit -q -m "ci: update pre-built rust-parser musl binaries"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed $(git rev-parse --short HEAD) onto $BRANCH"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — the tip moved; retrying from the new tip"
            git reset -q --hard FETCH_HEAD
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
