name: Build Rust Server Audio Binaries

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['rust-server-audio/**', '.github/workflows/build-rust-server-audio.yml']

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_name: rust-server-audio-win32-x64.exe
            use_cross: false

          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: rust-server-audio-darwin-x64
            use_cross: false

          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: rust-server-audio-darwin-arm64
            use_cross: false

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: rust-server-audio-linux-x64
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: rust-server-audio-linux-arm64
            use_cross: true

          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            binary_name: rust-server-audio-linux-arm
            use_cross: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server-audio
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          # Pinned + hashed: `releases/latest` piped straight into ~/.cargo/bin
          # meant a new (or hijacked) cross release ran on the next master push
          # and produced the shipped ARM/musl binaries. Bump the version and
          # the sha256 together (sha256sum of the release asset).
          curl -fsSL -o cross.tar.gz "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz"
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  cross.tar.gz" | sha256sum -c -
          tar xzf cross.tar.gz -C "$HOME/.cargo/bin" && rm cross.tar.gz

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cd rust-server-audio
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }} --manifest-path rust-server-audio/Cargo.toml
          fi
        shell: bash

      - name: Rename binary
        run: |
          src="rust-server-audio/target/${{ matrix.target }}/release/rust-server-audio"
          if [[ "${{ matrix.binary_name }}" == *.exe ]]; then
            src="${src}.exe"
          fi
          mkdir -p staging
          cp "$src" "staging/${{ matrix.binary_name }}"
        shell: bash

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: staging/${{ matrix.binary_name }}
          retention-days: 1

  commit-binaries:
    name: Commit binaries
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: bin/rust-server-audio
          merge-multiple: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # chmod BEFORE staging: a file download-artifact CREATES (vs
          # overwrites) lands 644, and an index-only mode fix leaves an
          # unstaged mode change that breaks `git pull --rebase` below.
          # See build-rust-parser.yml for the full story.
          chmod +x bin/rust-server-audio/rust-server-audio-*
          # Provenance stamp (see build-rust-parser.yml): the source tree these
          # binaries were built from; build-bun's tag build asserts it.
          git rev-parse "${{ github.sha }}:rust-server-audio" > bin/rust-server-audio/.source-tree
          git add bin/rust-server-audio/rust-server-audio-* bin/rust-server-audio/.source-tree
          # Belt-and-braces: force 100755 in the index so user checkouts get
          # `+x` — without it, server-playback.js spawn hits EACCES on every
          # boot in Docker.
          git update-index --chmod=+x bin/rust-server-audio/rust-server-audio-*
          if git diff --cached --quiet; then
            echo "No binary changes to commit"
          else
            git commit -m "ci: update pre-built rust-server-audio binaries"
            # Rebase-and-retry: sibling binary workflows race this push —
            # see build-rust-parser.yml's commit step for the rationale.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin ${{ github.ref_name }}
              if git push; then exit 0; fi
              echo "push rejected (attempt $attempt) — a sibling workflow pushed; retrying"
              sleep $(( (RANDOM % 5) + 2 ))
            done
            echo "::error::binary push failed after 5 attempts"
            exit 1
          fi
