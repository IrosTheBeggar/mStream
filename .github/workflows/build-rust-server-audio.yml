name: Build Rust Server Audio Binaries

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['rust-server-audio/**', '.github/workflows/build-rust-server-audio.yml']

# Serialize runs of THIS workflow per ref (see build-rust-parser.yml — same
# rationale; sibling families keep their own groups on purpose).
concurrency:
  group: build-rust-server-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_name: rust-server-audio-win32-x64.exe
            use_cross: false

          - target: x86_64-apple-darwin
            runner: macos-latest
            binary_name: rust-server-audio-darwin-x64
            use_cross: false

          - target: aarch64-apple-darwin
            runner: macos-latest
            binary_name: rust-server-audio-darwin-arm64
            use_cross: false

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: rust-server-audio-linux-x64
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_name: rust-server-audio-linux-arm64
            use_cross: true

          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            binary_name: rust-server-audio-linux-arm
            use_cross: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server-audio
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          # Pinned + hashed: `releases/latest` piped straight into ~/.cargo/bin
          # meant a new (or hijacked) cross release ran on the next master push
          # and produced the shipped ARM/musl binaries. Bump the version and
          # the sha256 together (sha256sum of the release asset).
          curl -fsSL -o cross.tar.gz "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz"
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  cross.tar.gz" | sha256sum -c -
          tar xzf cross.tar.gz -C "$HOME/.cargo/bin" && rm cross.tar.gz

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cd rust-server-audio
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }} --manifest-path rust-server-audio/Cargo.toml
          fi
        shell: bash

      - name: Rename binary
        run: |
          src="rust-server-audio/target/${{ matrix.target }}/release/rust-server-audio"
          if [[ "${{ matrix.binary_name }}" == *.exe ]]; then
            src="${src}.exe"
          fi
          mkdir -p staging
          cp "$src" "staging/${{ matrix.binary_name }}"
        shell: bash

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: staging/${{ matrix.binary_name }}
          # 7, not 1: the commit job refuses a partial set (see there).
          retention-days: 7

  commit-binaries:
    name: Commit binaries
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Into a scratch dir, NOT bin/ — see build-rust-parser.yml's commit
      # job: the inventory must see exactly what this run built, and the
      # no-rebase loop re-checkouts the tip, which needs a clean worktree.
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: staging
          merge-multiple: true

      - name: Commit and push
        env:
          TRIGGER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Inventory: every leg, non-empty (see build-rust-parser.yml).
          names="rust-server-audio-win32-x64.exe rust-server-audio-darwin-x64 rust-server-audio-darwin-arm64 rust-server-audio-linux-x64 rust-server-audio-linux-arm64 rust-server-audio-linux-arm"
          missing=""
          for name in $names; do
            [ -s "staging/$name" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::not all rust-server-audio binaries were built by this run (missing:$missing) — an artifact expired or a leg was skipped; re-run ALL jobs (or dispatch the workflow), never 'failed jobs only'"
            exit 1
          fi

          # 2. Provenance stamp from the TRIGGER sha (see build-rust-parser.yml);
          #    build-bun's tag build asserts it.
          stamp="$(mktemp)"
          git rev-parse "$TRIGGER_SHA:rust-server-audio" > "$stamp"
          echo "stamp for $TRIGGER_SHA:"; sed 's/^/  /' "$stamp"

          # 3. No-rebase loop: land on the current tip, stand down if a newer
          #    rust-server-audio/ tree already got there. Full rationale in
          #    build-rust-parser.yml's commit job. (+x matters here too:
          #    without it, server-playback.js spawn hits EACCES on every boot
          #    in Docker.)
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin "$BRANCH"
            git checkout -q --detach FETCH_HEAD
            if ! git diff --quiet "$TRIGGER_SHA" FETCH_HEAD -- rust-server-audio; then
              echo "master already carries a rust-server-audio/ tree newer than $TRIGGER_SHA — that push's run owns this family's binaries; standing down without committing"
              exit 0
            fi
            for name in $names; do
              cp "staging/$name" "bin/rust-server-audio/$name"
              chmod +x "bin/rust-server-audio/$name"
              git add "bin/rust-server-audio/$name"
              git update-index --chmod=+x "bin/rust-server-audio/$name"
            done
            cp "$stamp" bin/rust-server-audio/.source-tree
            git add bin/rust-server-audio/.source-tree
            if git diff --cached --quiet; then
              echo "No binary changes to commit (master already has this exact set)"
              exit 0
            fi
            git commit -q -m "ci: update pre-built rust-server-audio binaries"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed $(git rev-parse --short HEAD) onto $BRANCH"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — the tip moved; retrying from the new tip"
            git reset -q --hard FETCH_HEAD
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
