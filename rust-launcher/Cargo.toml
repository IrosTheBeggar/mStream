[package]
name = "mstream-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mstream-launcher"
path = "src/main.rs"

[dependencies]
# Tray icon + menu (Tauri's tray-icon, which re-exports muda for the menu
# types). Both need a live event loop on the MAIN thread; tao supplies the
# cross-platform pump (win32 message loop / NSApplication / gtk). Linux
# build deps: libgtk-3-dev + libayatana-appindicator3-dev; at runtime a
# missing StatusNotifier host degrades gracefully (server still runs).
# default-features = false drops the `libxdo` feature: it hard-links
# libxdo.so.3 (xdotool's lib — NOT part of any stock desktop) yet muda only
# uses it for predefined Copy/Cut/Paste items this menu doesn't have. With
# it on, the shipped binary died at the dynamic loader on every machine
# without xdotool installed — caught by the v6.20.0 tag smoke. The
# remaining hard links are glibc + GTK3 only; CI asserts exactly that set.
# Since tray-icon 0.24 the GTK/appindicator Linux backend is ALSO behind a
# (default) feature, so it has to come back by name: without `gtk` the crate
# still compiles on Linux but builds no tray at all.
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
# tao's defaults grew a `dbus` feature (0.35+, XDG-portal colour-scheme
# lookup) that hard-links libdbus-1.so.3 — outside the allowed NEEDED set,
# and not a -dev package the debian:11 build container installs. We only use
# the event loop, so keep the pre-0.35 feature set: rwh_06 (raw-window-handle
# impls) and x11 (dlopen'd through x11-dl; gdkx11 rides the already-linked
# libgdk-3).
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
# Login-item registration: HKCU Run key (Windows), LaunchAgent plist (macOS,
# see set_macos_launch_mode in autostart.rs — the AppleScript route would tie
# us to System Events, and 0.6's SMAppService route needs macOS 13+ plus a
# signed bundle), XDG autostart .desktop (Linux). The launcher registers
# ITSELF (with --autostarted), never the server. 0.6 creates its own
# containers (Run key / ~/.config/autostart / ~/Library/LaunchAgents), which
# retired the winreg pre-create this crate used to carry for fresh Windows
# profiles.
auto-launch = "0.6"
# Default-browser opener; that_detached so the browser never ties to our
# process lifetime.
open = "5"
# Single-instance advisory file lock in the data home. A second launch must
# focus the running server (open the browser), not race it for the port.
fslock = "0.2"
# Read the server config for the port; read/write the tiny launcher state file.
serde_json = "1"
# Decode the embedded tray PNG (build/icon.png) to the RGBA buffer tray-icon
# wants. Deliberately not the `image` crate — png alone keeps the build light.
# Same major tray-icon/muda use themselves, so the lock carries one copy.
png = "0.18"

[target.'cfg(windows)'.dependencies]
# The range tray-icon and muda resolve to (>=0.60, <=0.61) — one copy in the
# lock instead of the 0.59 + 0.61 pair the previous pin produced.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Exe icon + VersionInfo (see build.rs). winresource is the maintained fork
# of winres; serde_json reads the repo package.json so the version string
# can't drift from the release. Unconditional (not cfg(windows)-gated):
# build.rs keys the work off CARGO_CFG_TARGET_OS at runtime so CROSS-builds
# for windows embed resources too — a cfg gate here would ask about the
# HOST instead. Both crates compile fine on every host.
winresource = "0.1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
